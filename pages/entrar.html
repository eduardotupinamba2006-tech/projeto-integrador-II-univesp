<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Certidões e Dízimo</title>
<meta name="color-scheme" content="light dark">
<link rel="preload" href="/fonts/outfit-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/light/style.css">
<link rel="stylesheet" href="/css/estilo.css">
<script src="/js/layout.js"></script>
</head>
<body>
<site-cabecalho></site-cabecalho>

<main id="conteudo" class="estreito" tabindex="-1">
  <h1>Entrar</h1>
  <form id="form-entrar" class="cartao" novalidate>
    <div class="campo">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required>
    </div>
    <button type="submit" class="botao">Entrar</button>
    <div id="mensagem" class="mensagem" role="alert"></div>
  </form>
  <p><a href="/pages/recuperar-senha.html">Esqueci minha senha</a></p>
  <p>Ainda não tem conta? <a href="/pages/cadastro.html">Criar conta</a></p>
</main>

<site-rodape></site-rodape>
<script type="module" src="/js/paginas/entrar.js"></script>
</body>
</html>
