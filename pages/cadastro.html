<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta · Certidões e Dízimo</title>
<meta name="color-scheme" content="light dark">
<link rel="preload" href="/fonts/outfit-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/light/style.css">
<link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
<header class="cabecalho">
  <div class="cabecalho-conteudo">
    <a class="marca" href="/"><i class="ph-light ph-church" aria-hidden="true"></i>Certidões e Dízimo</a>
    <nav class="nav-principal" id="nav-principal" aria-label="Principal"><ul></ul></nav>
  </div>
</header>

<main id="conteudo" class="estreito" tabindex="-1">
  <h1>Criar conta</h1>
  <form id="form-cadastro" class="cartao" novalidate>
    <div class="campo">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" name="nome" autocomplete="name" required>
    </div>
    <div class="campo">
      <label for="cpf">CPF</label>
      <input type="text" id="cpf" name="cpf" inputmode="numeric" autocomplete="off" required data-dica="cpf-dica" aria-describedby="cpf-dica">
      <span class="dica" id="cpf-dica">Somente números ou no formato 000.000.000-00.</span>
    </div>
    <div class="campo">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="new-password" required data-dica="senha-dica" aria-describedby="senha-dica">
      <span class="dica" id="senha-dica">Pelo menos 8 caracteres.</span>
    </div>
    <div class="campo">
      <label for="senha2">Confirme a senha</label>
      <input type="password" id="senha2" name="senha2" autocomplete="new-password" required>
    </div>
    <button type="submit" class="botao">Criar conta</button>
    <div id="mensagem" class="mensagem" role="alert"></div>
  </form>
  <p>Já tem conta? <a href="/pages/entrar.html">Entrar</a></p>
</main>

<footer class="rodape">Projeto Integrador II, UNIVESP. Todos os dados de demonstração são fictícios.</footer>
<script type="module" src="/js/paginas/cadastro.js"></script>
</body>
</html>
