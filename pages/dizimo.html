<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dízimo · Certidões e Dízimo</title>
<meta name="color-scheme" content="light dark">
<link rel="preload" href="/fonts/outfit-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/light/style.css">
<link rel="stylesheet" href="/css/estilo.css">
<script src="/js/layout.js"></script>
</head>
<body>
<site-cabecalho></site-cabecalho>

<main id="conteudo" class="formulario" tabindex="-1">
  <h1>Dízimo</h1>
  <p class="introducao">O valor informado vai integralmente para a paróquia escolhida. O sistema não cobra nenhuma taxa sobre o dízimo.</p>

  <form id="form-dizimo" class="cartao" novalidate>
    <div id="escolha-paroquia"></div>

    <div class="campo">
      <label for="valor">Valor (R$)</label>
      <input type="text" id="valor" name="valor" inputmode="decimal" required data-dica="valor-dica" aria-describedby="valor-dica">
      <span class="dica" id="valor-dica">Entre R$ 1,00 e R$ 100.000,00. Exemplo: 50,00.</span>
    </div>

    <label class="opcao">
      <input type="checkbox" id="cadastrar" name="cadastrar">
      <span>Quero me cadastrar como dizimista desta paróquia <span class="dica" id="situacao-dizimista"></span></span>
    </label>

    <button type="submit" class="botao"><i class="ph-light ph-qr-code" aria-hidden="true"></i>Gerar Pix</button>
    <div id="mensagem" class="mensagem" role="alert"></div>
  </form>

  <div id="pix" hidden></div>
</main>

<site-rodape></site-rodape>
<script type="module" src="/js/paginas/dizimo.js"></script>
</body>
</html>
