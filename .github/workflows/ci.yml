name: CI

on:
  push:
  pull_request:

jobs:
  banco:
    name: Banco de dados (migrations + RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: |
          npm ci
          pip install -r requirements-dev.txt

      - name: Subir Supabase local (aplica migrations e seed)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Testes de isolamento de RLS
        run: pytest tests/pytest -m rls -v
